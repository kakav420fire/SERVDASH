<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Server Dashboard</title>
<style>
:root{--bg:#0f1419;--card:#1a212b;--text:#e6edf3;--mut:#8b98a5;--acc:#3ddc84;--bad:#ff5c5c;--line:#2a3441}
@media (prefers-color-scheme:light){:root{--bg:#f4f6f8;--card:#fff;--text:#1b2430;--mut:#667788;--acc:#17a35a;--bad:#d33;--line:#dde3ea}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif;padding:20px}
.wrap{max-width:1000px;margin:auto}
.top{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.top img{width:64px;height:64px;border-radius:10px;image-rendering:pixelated;background:var(--card);display:none}
h1{margin:0;font-size:28px}
.sub{color:var(--mut);margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h2{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.big{font-size:24px;font-weight:700;word-break:break-word}
.sm{font-size:18px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;background:var(--mut)}
.on{background:var(--acc)}.off{background:var(--bad)}
.motd{font-size:22px;font-weight:600;padding:6px 0}
.real{font-family:ui-monospace,monospace;background:var(--bg);border-radius:8px;padding:10px;word-break:break-word;white-space:pre-line}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:4px 12px 4px 4px}
.chip img{width:24px;height:24px;border-radius:50%}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--acc);width:0}
.mut{color:var(--mut)}
table{width:100%;border-collapse:collapse}
td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}
td:first-child{color:var(--mut);width:42%}
td:last-child{word-break:break-word}
svg{width:100%;height:90px;display:block}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><img id="icon" alt=""><h1 id="name">Server</h1></div>
  <div class="sub">Live status refreshes every 30 seconds. <span id="upd"></span></div>

  <div class="grid">
    <div class="card"><h2>Status</h2><div class="big"><span id="dot" class="dot"></span><span id="status">...</span></div></div>
    <div class="card"><h2>Players online</h2><div class="big" id="count">-</div><div class="bar"><i id="fill"></i></div></div>
    <div class="card"><h2>Version</h2><div class="big sm" id="ver">-</div></div>
    <div class="card"><h2>Software</h2><div class="big sm" id="soft">-</div></div>
  </div>

  <div class="card" style="margin-bottom:12px">
    <h2>Message of the day</h2>
    <div class="motd" id="motd"></div>
    <div class="mut">New one every day.</div>
  </div>

  <div class="card" style="margin-bottom:12px">
    <h2>Online right now</h2>
    <div class="chips" id="online"><span class="mut">Loading...</span></div>
  </div>

  <div class="cols">
    <div class="card"><h2>Server details</h2><table id="details"></table></div>
    <div class="card">
      <h2>Real server MOTD</h2>
      <div class="real" id="real">-</div>
      <h2 style="margin-top:18px">Player count history (this browser)</h2>
      <svg id="spark" viewBox="0 0 300 90" preserveAspectRatio="none"></svg>
      <div class="mut" id="peak"></div>
      <div class="mut" id="uptime"></div>
    </div>
  </div>
</div>

<script>
// ====== CHANGE THESE ======
const SERVER_ADDRESS = "sdss-smp.modrinth.gg"; // your server address from Modrinth
const REFRESH_SECONDS = 30;
// ==========================

// Daily random messages. Add or delete whatever you want.
const MESSAGES = [
  "the fridge is running",
  "gerald was here",
  "bread has no legs",
  "somebody left a sock in the nether",
  "one (1) chicken is missing",
  "turn left at the potato",
  "dont look behind the couch",
  "wednesday is a state of mind",
  "the cow knows what you did",
  "have u tried turning the sun off",
  "free pickle with every login",
  "i saw a boat go uphill",
  "spaghetti is just long pasta",
  "your chair is too far from your desk",
  "ten hours until soup",
  "the moon is mid today",
  "someone ate the last block",
  "a villager said hmm",
  "this message is fake",
  "do not trust the left shoe",
  "yes",
  "carrots are loud today",
  "the floor is probably lava",
  "banana phone is ringing",
  "my cat is the real admin",
  "lol",
  "nobody asked for this tuesday",
  "the wifi smells like feet",
  "a wild sandwich appeared",
  "brb touching grass",
  "dave left the oven on",
  "the zombie has a mortgage",
  "everyone is a little bit bread",
  "there are exactly 4 clouds",
  "never trust a fish with a watch",
  "soup soup soup soup",
  "its giving gravel",
  "an enderman looked at me funny",
  "pls feed the dog block",
  "the toaster is online",
  "cheese but sideways",
  "happy random day",
  "unplug the horse",
  "gravy has entered the chat"
];

const $ = id => document.getElementById(id);
const head = n => `https://mc-heads.net/avatar/${encodeURIComponent(n)}/48`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Same message for everyone all day, changes at local midnight
function dailyMessage(){
  const d = new Date();
  const day = Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
  let x = (day * 2654435761) >>> 0;
  x ^= x >>> 13; x = Math.imul(x, 1274126177) >>> 0;
  return MESSAGES[x % MESSAGES.length];
}

$("name").textContent = SERVER_ADDRESS;
$("motd").textContent = dailyMessage();

const row = (k, v) => (v === undefined || v === null || v === "" ? "" : `<tr><td>${k}</td><td>${esc(v)}</td></tr>`);

async function loadStatus(){
  try{
    const r = await fetch(`https://api.mcsrvstat.us/3/${SERVER_ADDRESS}`);
    const d = await r.json();
    const up = !!d.online;
    $("dot").className = "dot " + (up ? "on" : "off");
    $("status").textContent = up ? "Online" : "Offline";
    $("upd").textContent = "Updated " + new Date().toLocaleTimeString();
    track(up, d.players?.online ?? 0);

    if(d.icon){ $("icon").src = d.icon; $("icon").style.display = "block"; }

    const rows = [row("Address", SERVER_ADDRESS), row("Hostname", d.hostname), row("IP", d.ip), row("Port", d.port)];
    if(!up){
      $("count").textContent = "0"; $("fill").style.width = "0";
      $("online").innerHTML = '<span class="mut">Server is offline (or starting up).</span>';
      $("details").innerHTML = rows.join("");
      return;
    }

    const on = d.players?.online ?? 0, max = d.players?.max ?? 0;
    $("count").textContent = `${on} / ${max || "?"}`;
    $("fill").style.width = max ? Math.min(100, on / max * 100) + "%" : "0";
    $("ver").textContent = d.version || "-";
    $("soft").textContent = d.software || "Vanilla";
    $("real").textContent = (d.motd?.clean || []).join("\n") || "-";

    const list = d.players?.list || [];
    $("online").innerHTML = list.length
      ? list.map(p => `<span class="chip"><img src="${head(p.name)}" alt=""><span>${esc(p.name)}</span></span>`).join("")
      : `<span class="mut">${on ? "Player names hidden by server." : "Nobody online."}</span>`;

    rows.push(
      row("Version", d.version),
      row("Software", d.software),
      row("Protocol", d.protocol?.name ? `${d.protocol.name} (${d.protocol.version})` : d.protocol?.version),
      row("Gamemode", d.gamemode),
      row("World name", d.map?.clean),
      row("Players", `${on} / ${max}`),
      row("Plugins loaded", d.plugins?.length),
      row("Mods loaded", d.mods?.length),
      row("Server ID", d.serverid),
      row("Blocked by Mojang EULA", d.eula_blocked === undefined ? "" : (d.eula_blocked ? "Yes" : "No")),
      row("Status cached until", d.debug?.cachetime ? new Date(d.debug.cachetime * 1000 + 60000).toLocaleTimeString() : "")
    );
    $("details").innerHTML = rows.join("");
  }catch(e){
    $("status").textContent = "Can't reach status API";
  }
}

function track(up, n){
  let h = [];
  try{ h = JSON.parse(localStorage.getItem("hist2") || "[]"); }catch(e){}
  h.push({u: up ? 1 : 0, n}); h = h.slice(-120);
  try{ localStorage.setItem("hist2", JSON.stringify(h)); }catch(e){}
  const max = Math.max(1, ...h.map(x => x.n));
  const pts = h.map((x,i) => `${(i/Math.max(1,h.length-1))*300},${85-(x.n/max)*80}`).join(" ");
  $("spark").innerHTML = `<polyline points="${pts}" fill="none" stroke="var(--acc)" stroke-width="2"/>`;
  $("peak").textContent = `Peak seen: ${Math.max(...h.map(x => x.n))} (last ${h.length} checks)`;
  const pct = Math.round(h.filter(x => x.u).length / h.length * 100);
  $("uptime").textContent = `Online in ${pct}% of the checks this browser has made`;
}

loadStatus();
setInterval(loadStatus, REFRESH_SECONDS * 1000);
</script>
</body>
</html>
